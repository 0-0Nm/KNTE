name: KNTE Preview
run-name: KNTE preview ${{ inputs.audit_id }}
on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: Non-secret audit identifier for this manual preview build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: knte-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit clean source
        run: python3 tools/audit_source.py
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Host tests and debug APK
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Record artifact provenance
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/KNTE-preview.apk
          sha256sum artifacts/KNTE-preview.apk > artifacts/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt
      - name: Upload internal preview and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knte-preview-${{ github.sha }}
          path: |
            artifacts/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 3
